{{define "home"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Shop</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐾 Pet Shop</h1>
            <p>Welcome to your favorite pet store</p>
        </header>

        <main>
            <div class="card">
                <h2>Already have an account?</h2>
                <p>Log in to access your profile and orders.</p>
                <a href="/login" class="btn btn-primary">Log In</a>
            </div>

            <div class="card">
                <h2>New here?</h2>
                <p>Sign up and start enjoying our offers.</p>
                <a href="/register" class="btn btn-secondary">Sign Up</a>
            </div>
        </main>

        <footer>
            <p>🐾 2026 Pet Shop</p>
        </footer>
    </div>
</body>
</html>
{{end}}
